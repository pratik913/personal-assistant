spring:
  application:
    name: personal-assistant-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/personal_assistant
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${AWS_S3_BUCKET}

openai:
  api-key: ${OPENAI_API_KEY}